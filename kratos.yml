version: v1.2.0

dsn: ${DSN}

serve:
  public:
    base_url: ${RAILWAY_PUBLIC_URL}
    cors:
      enabled: true
      allowed_origins:
        - ${KRATOS_BROWSER_URL}
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
        - X-Session-Token
        - X-CSRF-Token
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://0.0.0.0:4434

selfservice:
  default_browser_return_url: ${KRATOS_BROWSER_URL}
  allowed_return_urls:
    - ${KRATOS_BROWSER_URL}

  methods:
    password:
      enabled: true
    totp:
      config:
        issuer: Kratos
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    error:
      ui_url: ${KRATOS_BROWSER_URL}/error

    settings:
      ui_url: ${KRATOS_BROWSER_URL}/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: ${KRATOS_BROWSER_URL}/recovery
      use: code

    verification:
      enabled: true
      ui_url: ${KRATOS_BROWSER_URL}/verification
      use: code
      after:
        default_browser_return_url: ${KRATOS_BROWSER_URL}

    logout:
      after:
        default_browser_return_url: ${KRATOS_BROWSER_URL}/login

    login:
      ui_url: ${KRATOS_BROWSER_URL}/login
      lifespan: 10m

    registration:
      lifespan: 10m
      ui_url: ${KRATOS_BROWSER_URL}/registration
      after:
        password:
          hooks:
            - hook: session
        code:
          hooks:
            - hook: session

log:
  level: info
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - ${SECRETS_COOKIE}
  cipher:
    - ${SECRETS_CIPHER}

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: ${MAILTRAP_SMTP_URI}
    from_address: noreply@example.com
    from_name: Kratos

session:
  cookie:
    domain: ${COOKIE_DOMAIN}
    path: /
    same_site: Lax
  lifespan: 24h
